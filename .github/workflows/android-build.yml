name: Build Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'example/android/**'
      - 'example-expo/**'
      - 'nitrogen/generated/shared/**'
      - 'nitrogen/generated/android/**'
      - 'cpp/**'
      - 'android/**'
      - '**/bun.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'example/android/**'
      - 'example-expo/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/android/**'
      - 'cpp/**'
      - 'android/**'
      - '**/bun.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bare
            android-dir: example/android
            prepare: |
              cp example/ci/.env example/.env
          - label: expo
            android-dir: example-expo/android
            prepare: |
              cp example-expo/ci/GoogleService-Info.plist example-expo/GoogleService-Info.plist
              cp example-expo/ci/google-services.json example-expo/google-services.json
              cp example-expo/ci/.env example-expo/.env
              cd example-expo && bunx expo prebuild --platform android
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Prepare project for CI
        run: ${{ matrix.prepare }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.label }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.android-dir)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.label }}-
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        working-directory: ${{ matrix.android-dir }}
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Stop Gradle daemon
        working-directory: ${{ matrix.android-dir }}
        run: ./gradlew --stop
